limit_req_zone $binary_remote_addr zone=paklicense:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pakadminlogin:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name verify.lovenom.eu.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verify.lovenom.eu.org;

    ssl_certificate /etc/letsencrypt/live/verify.lovenom.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.lovenom.eu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location = /healthz {
        proxy_pass http://127.0.0.1:18888/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/license/verify {
        limit_req zone=paklicense burst=10 nodelay;
        proxy_pass http://127.0.0.1:18888/api/v1/license/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin/login {
        limit_req zone=pakadminlogin burst=10 nodelay;
        proxy_pass http://127.0.0.1:18888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:18888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
