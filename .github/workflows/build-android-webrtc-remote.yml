name: Build Android WebRTC Remote APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webrtc-remote/**'
      - '.github/workflows/build-android-webrtc-remote.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
      RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
      RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
      RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-webrtc-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RYLUX_KEYSTORE_B64" || { echo 'Missing RYLUX_KEYSTORE_B64'; exit 1; }
          test -n "$RYLUX_KEYSTORE_PASSWORD" || { echo 'Missing RYLUX_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$RYLUX_KEY_ALIAS" || { echo 'Missing RYLUX_KEY_ALIAS'; exit 1; }
          test -n "$RYLUX_KEY_PASSWORD" || { echo 'Missing RYLUX_KEY_PASSWORD'; exit 1; }
          echo "$RYLUX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rylux-release.jks"
          chmod 600 "$RUNNER_TEMP/rylux-release.jks"
          echo "RYLUX_KEYSTORE_PATH=$RUNNER_TEMP/rylux-release.jks" >> "$GITHUB_ENV"
      - run: gradle :app:assembleRelease --stacktrace
      - name: Verify persistent signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-webrtc-remote-v3.0.0-alpha4-tailscale-vpn
          path: |
            android-webrtc-remote/app/build/outputs/apk/release/app-release.apk
            android-webrtc-remote/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

