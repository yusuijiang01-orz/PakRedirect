name: Build Android WebRTC Remote APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webrtc-remote/**'
      - '.github/workflows/build-android-webrtc-remote.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webrtc-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleRelease --stacktrace
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-webrtc-remote-v3.0.0-alpha1
          path: |
            android-webrtc-remote/app/build/outputs/apk/release/app-release.apk
            android-webrtc-remote/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
