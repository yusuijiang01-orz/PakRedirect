name: Build RYLUX script test APK

on:
  push:
    branches:
      - codex/rylux-trash-test-build-20261031
    paths:
      - .github/workflows/build-script-test.yml
      - app/src/main/**
      - app/build.gradle
      - patches/blackbox-api33-components.patch
      - patches/blackbox-foreground-top-activity.patch
      - patches/blackbox-rylux-script-runtime.patch
      - vendor/BlackBoxReborn
      - build.gradle
      - settings.gradle
      - gradle.properties

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-24.04
    env:
      RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
      RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
      RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
      RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply BlackBox Android component compatibility patch
        run: git -C vendor/BlackBoxReborn apply "$GITHUB_WORKSPACE/patches/blackbox-api33-components.patch"

      - name: Apply BlackBox foreground activity query patch
        run: git -C vendor/BlackBoxReborn apply "$GITHUB_WORKSPACE/patches/blackbox-foreground-top-activity.patch"

      - name: Apply RYLUX script runtime compatibility changes
        run: git -C vendor/BlackBoxReborn apply "$GITHUB_WORKSPACE/patches/blackbox-rylux-script-runtime.patch"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"

      - name: Restore persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RYLUX_KEYSTORE_B64" || { echo 'Missing RYLUX_KEYSTORE_B64 repository secret'; exit 1; }
          test -n "$RYLUX_KEYSTORE_PASSWORD" || { echo 'Missing RYLUX_KEYSTORE_PASSWORD repository secret'; exit 1; }
          test -n "$RYLUX_KEY_ALIAS" || { echo 'Missing RYLUX_KEY_ALIAS repository secret'; exit 1; }
          test -n "$RYLUX_KEY_PASSWORD" || { echo 'Missing RYLUX_KEY_PASSWORD repository secret'; exit 1; }
          echo "$RYLUX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rylux-release.jks"
          chmod 600 "$RUNNER_TEMP/rylux-release.jks"
          echo "RYLUX_KEYSTORE_PATH=$RUNNER_TEMP/rylux-release.jks" >> "$GITHUB_ENV"

      - name: Build signed test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace \
            -PryluxVersionName=2.4.82-test \
            -PryluxVersionCode=103
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -F "versionName='2.4.82-test'"
          cp "$APK" RYLUX-v2.4.82-test.apk
          sha256sum RYLUX-v2.4.81-test.apk

      - name: Upload test APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: RYLUX-v2.4.82-test-${{ github.sha }}
          path: RYLUX-v2.4.82-test.apk
          if-no-files-found: error
          retention-days: 14
