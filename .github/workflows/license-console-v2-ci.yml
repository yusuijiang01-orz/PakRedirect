name: License console v2 smoke test

on:
  push:
    branches:
      - feature/license-console-v2

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Syntax check
        run: python -m py_compile backend/app.py backend/admin_v2.py backend/manage.py
      - name: Admin v2 smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          export PAKREDIRECT_LICENSE_DB="$RUNNER_TEMP/licenses.db"
          python - <<'PY'
          import app
          import admin_v2 as admin
          from fastapi.testclient import TestClient

          app.init_db()
          assert admin.verify_password('PakRedirect@2026!')
          client = TestClient(app.app, base_url='https://testserver')

          r = client.get('/admin/login')
          assert r.status_code == 200
          assert 'PakRedirect' in r.text

          r = client.post('/admin/api/login', json={'username':'admin','password':'PakRedirect@2026!'})
          assert r.status_code == 200
          r = client.get('/admin/api/me')
          assert r.status_code == 200
          me = r.json()
          assert me['must_change_password'] is True
          csrf = me['csrf']

          r = client.post('/admin/api/credentials', headers={'X-CSRF-Token':csrf}, json={
              'current_password':'PakRedirect@2026!',
              'username':'owner',
              'new_password':'ChangedPassword123!',
              'confirm_password':'ChangedPassword123!'
          })
          assert r.status_code == 200
          me = client.get('/admin/api/me').json()
          assert me['username'] == 'owner'
          assert me['must_change_password'] is False
          csrf = me['csrf']

          r = client.post('/admin/api/licenses/generate', headers={'X-CSRF-Token':csrf}, json={
              'days':30,'quantity':3,'label':'ci'
          })
          assert r.status_code == 200 and len(r.json()['keys']) == 3

          r = client.get('/admin/api/licenses')
          assert r.status_code == 200 and r.json()['total'] == 3
          lid = r.json()['items'][0]['id']

          assert client.post(f'/admin/api/licenses/{lid}/toggle', headers={'X-CSRF-Token':csrf}, json={'enabled':False}).status_code == 200
          assert client.post(f'/admin/api/licenses/{lid}/extend', headers={'X-CSRF-Token':csrf}, json={'days':7}).status_code == 200
          assert client.get('/admin/api/logs').status_code == 200
          assert client.get('/admin/api/licenses/export.csv').status_code == 200
          assert client.get('/admin').status_code == 200
          assert client.get('/admin/assets/app.js').status_code == 200
          print('license console v2 smoke ok')
          PY
