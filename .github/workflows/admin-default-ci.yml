name: Admin default login check

on:
  push:
    branches:
      - feature/admin-default-login

jobs:
  backend-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Syntax check
        run: python -m py_compile backend/app.py backend/admin_console.py backend/manage.py

      - name: Bootstrap and credential-change smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          export PAKREDIRECT_LICENSE_DB="$RUNNER_TEMP/licenses.db"
          python - <<'PY'
          import app
          import admin_console as admin

          app.init_db()
          assert admin.configured()
          assert admin.admin_config()['username'] == 'admin'
          assert admin.verify_password('PakRedirect@2026!')
          assert not admin.verify_password('wrong')
          assert admin.must_change_password()

          old_token = admin.new_session()
          assert admin.session_user(old_token) == 'admin'
          assert len(admin.csrf(old_token)) == 64

          new_hash = admin.make_password_hash('ChangedPassword123!')
          with admin.open_db() as db:
              db.execute(
                  "UPDATE admin_settings SET username=?,password_hash=?,must_change_password=0,session_secret=?,updated_at=? WHERE id=1",
                  ('owner', new_hash, 'X' * 64, admin.iso(admin.utc_now())),
              )
              db.commit()

          assert admin.session_user(old_token) is None
          assert admin.verify_password('ChangedPassword123!')
          assert not admin.verify_password('PakRedirect@2026!')
          assert not admin.must_change_password()
          new_token = admin.new_session()
          assert admin.session_user(new_token) == 'owner'

          keys = admin.create_licenses(30, 3, 'ci')
          assert len(keys) == 3
          rows, stats = admin.load_rows(keys[0], '')
          assert len(rows) == 1
          assert stats['total'] == 3
          html = admin.dashboard(new_token).body.decode('utf-8')
          assert '/admin/change-password' in html
          print('admin default login smoke ok')
          PY
