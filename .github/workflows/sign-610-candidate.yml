name: Build localized 610 APK with RYLUX localhost interception

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sign-610-localized-candidate
    paths:
      - apk/610-localized-candidate/RYLUX-610-localized-arm64-UNSIGNED.apk
      - .github/workflows/sign-610-candidate.yml
      - tools/patch_610_signature_guard.py

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
          RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
          RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
          RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RYLUX_KEYSTORE_B64" || -z "$RYLUX_KEYSTORE_PASSWORD" || -z "$RYLUX_KEY_ALIAS" || -z "$RYLUX_KEY_PASSWORD" ]]; then
            echo 'All four RYLUX signing secrets are required.' >&2
            exit 1
          fi

      - name: Check out the candidate APK from Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null

      - name: Download verified Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' \
            --output "$RUNNER_TEMP/apktool_3.0.3.jar"
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  '"$RUNNER_TEMP/apktool_3.0.3.jar" | sha256sum --check --status

      - name: Patch signer guard in all ABIs, sign, and verify the APK
        shell: bash
        env:
          RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
          RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
          RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
          RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SOURCE='apk/610-localized-candidate/RYLUX-610-localized-arm64-UNSIGNED.apk'
          test -s "$SOURCE"
          if head -c 80 "$SOURCE" | grep -aq 'version https://git-lfs.github.com/spec/v1'; then
            echo 'The candidate APK is still an LFS pointer.' >&2
            exit 1
          fi

          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          BADGING="$("$TOOLS/aapt" dump badging "$SOURCE")"
          grep -Eq "^package: name='com\.tepaylink\.tamgioiphantranhmobile' versionCode='610' versionName='1\.0\.610'" <<<"$BADGING" || {
            echo 'Candidate APK package or version is not 1.0.610 (610).' >&2
            exit 1
          }

          python3 - "$SOURCE" <<'PY'
          import hashlib
          import sys
          import zipfile

          expected_arm64 = '3b84b0c013513701b59677debe63a8ccb90c7dd09c9793192deffbbdd1c6d114'
          with zipfile.ZipFile(sys.argv[1]) as apk:
              strings = apk.read('assets/settings/StringConstant.txt').decode('utf-8', errors='strict')
              rows = [line.split('\t', 1) for line in strings.splitlines()[1:] if '\t' in line]
              if len(rows) != 417 or not any(any('\u4e00' <= char <= '\u9fff' for char in row[1]) for row in rows):
                  raise SystemExit('Candidate Chinese StringConstant resource failed validation.')
              arm64 = apk.read('lib/arm64-v8a/libcocos2dcpp.so')
              digest = hashlib.sha256(arm64).hexdigest()
              if digest != expected_arm64:
                  raise SystemExit(f'Candidate arm64 encoding/native localization patch mismatch: {digest}')
          print('Verified 417 UTF-8 Chinese strings and the reviewed arm64 encoding patch.')
          PY

          java -jar "$RUNNER_TEMP/apktool_3.0.3.jar" decode --no-src --output "$RUNNER_TEMP/game-decoded" "$SOURCE"
          DECODED="$RUNNER_TEMP/game-decoded" python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root_dir = Path(os.environ['DECODED'])
          manifest_path = root_dir / 'AndroidManifest.xml'
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          manifest = tree.getroot()
          application = manifest.find('application')
          if application is None:
              raise SystemExit('Decoded APK has no application element.')

          labels = [application]
          for component in list(application.findall('activity')) + list(application.findall('activity-alias')):
              for intent in component.findall('intent-filter'):
                  actions = {item.get(android + 'name') for item in intent.findall('action')}
                  categories = {item.get(android + 'name') for item in intent.findall('category')}
                  if 'android.intent.action.MAIN' in actions and categories.intersection({
                      'android.intent.category.LAUNCHER', 'android.intent.category.LEANBACK_LAUNCHER'
                  }):
                      labels.append(component)
                      break
          if len(labels) == 1:
              raise SystemExit('No launcher activity or alias was found.')

          string_names = set()
          manifest_changed = False
          for element in labels:
              value = element.get(android + 'label')
              if value is None:
                  continue
              if value.startswith('@string/'):
                  string_names.add(value.removeprefix('@string/'))
              elif value.startswith('@') or value.startswith('?'):
                  raise SystemExit(f'Unsupported label reference: {value}')
              else:
                  element.set(android + 'label', '\u5c01\u795e\u699c\u624b\u6e38')
                  manifest_changed = True
          if application.get(android + 'label') is None:
              application.set(android + 'label', '\u5c01\u795e\u699c\u624b\u6e38')
              manifest_changed = True

          found = set()
          for path in sorted((root_dir / 'res').glob('values*/*.xml')):
              resource_tree = ET.parse(path)
              resources = resource_tree.getroot()
              changed = False
              for item in resources.findall('string'):
                  name = item.get('name')
                  if name in string_names:
                      item[:] = []
                      item.text = '\u5c01\u795e\u699c\u624b\u6e38'
                      found.add(name)
                      changed = True
              if changed:
                  resource_tree.write(path, encoding='utf-8', xml_declaration=True)
          if found != string_names:
              raise SystemExit('A referenced app or launcher label string is missing from decoded resources.')
          if manifest_changed:
              tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          PY
          java -jar "$RUNNER_TEMP/apktool_3.0.3.jar" build "$RUNNER_TEMP/game-decoded" --output "$RUNNER_TEMP/game-unsigned.apk"

          REBUILT="$RUNNER_TEMP/game-local-intercept-fixed-unsigned.apk"
          python3 tools/patch_610_signature_guard.py "$RUNNER_TEMP/game-unsigned.apk" "$REBUILT"

          KEYSTORE="$RUNNER_TEMP/rylux-release.jks"
          ALIGNED="$RUNNER_TEMP/RYLUX-610-aligned.apk"
          SIGNED='RYLUX-610-local-intercept-fixed.apk'
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
          printf '%s' "$RYLUX_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$TOOLS/zipalign" -f -p 4 "$REBUILT" "$ALIGNED"
          "$TOOLS/zipalign" -c -p 4 "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$RYLUX_KEY_ALIAS" \
            --ks-pass env:RYLUX_KEYSTORE_PASSWORD \
            --key-pass env:RYLUX_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          CERTS="$("$TOOLS/apksigner" verify --verbose --print-certs "$SIGNED")"
          grep -Eq '^Signer #1 certificate SHA-256 digest: 015c81c0cbc09d5dc1b825a673ef7676af4c51526870f2107d321c726c4d7aa7$' <<<"$CERTS" || {
            echo 'Signed certificate does not match the RYLUX 587 certificate.' >&2
            exit 1
          }
          python3 - "$TOOLS/aapt" "$SIGNED" <<'PY'
          import re
          import subprocess
          import sys

          badging = subprocess.run([sys.argv[1], 'dump', 'badging', sys.argv[2]], check=True,
                                   capture_output=True, text=True).stdout
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'", badging, re.M)
          if not package or package.groups() != ('com.tepaylink.tamgioiphantranhmobile', '610', '1.0.610'):
              raise SystemExit('Signed APK package or version changed unexpectedly.')
          app_label = re.search(r"^application-label:'([^']*)'$", badging, re.M)
          launch_labels = re.findall(r"^launchable-activity:.* label='([^']*)'", badging, re.M)
          expected = '\u5c01\u795e\u699c\u624b\u6e38'
          if not app_label or app_label.group(1) != expected or not launch_labels or any(x != expected for x in launch_labels):
              raise SystemExit('Application or launcher label is not the expected Chinese name.')
          print('Verified package version and Chinese application/launcher labels.')
          PY
          python3 - "$SIGNED" <<'PY'
          import sys
          import zipfile

          expected = b'http://127.0.0.1:18480/linkspak.txt'
          abis = {'arm64-v8a', 'armeabi-v7a', 'x86'}
          with zipfile.ZipFile(sys.argv[1]) as apk:
              libs = {name.split('/')[1]: name for name in apk.namelist()
                      if name.startswith('lib/') and name.endswith('/libcocos2dcpp.so')}
              if set(libs) != abis:
                  raise SystemExit(f'Unexpected native ABIs: {sorted(libs)}')
              for abi, name in sorted(libs.items()):
                  data = apk.read(name)
                  if data.count(expected) != 1 or b'https://cdn.tamgioipt.vn/linkspak.txt' in data:
                      raise SystemExit(f'{abi} does not route linkspak to the local RYLUX server')
          print('Verified local linkspak interception in all native ABIs.')
          PY
          sha256sum "$SIGNED"

      - name: Upload signed APK as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RYLUX-610-local-intercept-fixed
          path: RYLUX-610-local-intercept-fixed.apk
          if-no-files-found: error
          retention-days: 14
