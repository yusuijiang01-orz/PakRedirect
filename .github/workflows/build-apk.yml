name: Build and Release RYLUX APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 2.1.2'
        required: true
        default: '2.1.2'
      version_code:
        description: 'Monotonically increasing Android versionCode'
        required: true
        default: '9'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
      RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
      RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
      RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RYLUX_KEYSTORE_B64" || { echo 'Missing RYLUX_KEYSTORE_B64 secret'; exit 1; }
          test -n "$RYLUX_KEYSTORE_PASSWORD" || { echo 'Missing RYLUX_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$RYLUX_KEY_ALIAS" || { echo 'Missing RYLUX_KEY_ALIAS secret'; exit 1; }
          test -n "$RYLUX_KEY_PASSWORD" || { echo 'Missing RYLUX_KEY_PASSWORD secret'; exit 1; }
          echo "$RYLUX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rylux-release.jks"
          chmod 600 "$RUNNER_TEMP/rylux-release.jks"
          echo "RYLUX_KEYSTORE_PATH=$RUNNER_TEMP/rylux-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace \
            -PryluxVersionName='${{ inputs.version_name }}' \
            -PryluxVersionCode='${{ inputs.version_code }}'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "RYLUX-v${{ inputs.version_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: RYLUX v${{ inputs.version_name }}
          generate_release_notes: true
          files: |
            RYLUX-v${{ inputs.version_name }}.apk
