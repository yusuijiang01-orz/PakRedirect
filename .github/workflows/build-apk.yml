name: Build RYLUX APK (release optional)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 2.4.26-test'
        required: true
        default: '2.4.74-test'
      version_code:
        description: 'Monotonically increasing Android versionCode'
        required: true
        default: '95'
      publish_release:
        description: 'Publish GitHub and Gitee releases after building (leave off for a test build)'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - codex/sign-610-localized-candidate
    paths:
      - .github/workflows/build-apk.yml
      - app/build.gradle
      - app/src/main/java/com/example/pakredirect/RyluxAdaptiveLayoutFix.java
      - app/src/main/java/com/example/pakredirect/RyluxHomeNavigationPolish.java
      - app/src/main/java/com/example/pakredirect/RyluxUiPolish.java
      - app/src/main/java/com/example/pakredirect/RyluxResponsiveTuner.java
      - app/src/main/java/com/example/pakredirect/RyluxViewport.java

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      RYLUX_VERSION_NAME: ${{ inputs.version_name || '2.4.74-test' }}
      RYLUX_VERSION_CODE: ${{ inputs.version_code || '95' }}
      RYLUX_KEYSTORE_B64: ${{ secrets.RYLUX_KEYSTORE_B64 }}
      RYLUX_KEYSTORE_PASSWORD: ${{ secrets.RYLUX_KEYSTORE_PASSWORD }}
      RYLUX_KEY_ALIAS: ${{ secrets.RYLUX_KEY_ALIAS }}
      RYLUX_KEY_PASSWORD: ${{ secrets.RYLUX_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply BlackBox Android component compatibility patch
        shell: bash
        run: git -C vendor/BlackBoxReborn apply "$GITHUB_WORKSPACE/patches/blackbox-api33-components.patch"

      - name: Apply BlackBox foreground activity query patch
        shell: bash
        run: git -C vendor/BlackBoxReborn apply "$GITHUB_WORKSPACE/patches/blackbox-foreground-top-activity.patch"

      - name: Check Gitee release credential
        if: inputs.publish_release
        env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$GITEE_RELEASE_TOKEN" || {
            echo "Missing GITEE_RELEASE_TOKEN repository secret"
            exit 1
          }

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.13846066"

      - name: Restore persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RYLUX_KEYSTORE_B64" || { echo 'Missing RYLUX_KEYSTORE_B64 secret'; exit 1; }
          test -n "$RYLUX_KEYSTORE_PASSWORD" || { echo 'Missing RYLUX_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$RYLUX_KEY_ALIAS" || { echo 'Missing RYLUX_KEY_ALIAS secret'; exit 1; }
          test -n "$RYLUX_KEY_PASSWORD" || { echo 'Missing RYLUX_KEY_PASSWORD secret'; exit 1; }
          echo "$RYLUX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rylux-release.jks"
          chmod 600 "$RUNNER_TEMP/rylux-release.jks"
          echo "RYLUX_KEYSTORE_PATH=$RUNNER_TEMP/rylux-release.jks" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        shell: bash
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace \
            -PryluxVersionName="$RYLUX_VERSION_NAME" \
            -PryluxVersionCode="$RYLUX_VERSION_CODE"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "RYLUX-v${RYLUX_VERSION_NAME}.apk"

      - name: Upload non-release test APK artifact
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: RYLUX-v${{ env.RYLUX_VERSION_NAME }}-test-${{ github.sha }}
          path: RYLUX-v${{ env.RYLUX_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RYLUX_VERSION_NAME }}
          name: RYLUX v${{ env.RYLUX_VERSION_NAME }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            RYLUX-v${{ env.RYLUX_VERSION_NAME }}.apk

      - name: Sync signed APK to Gitee Release
        if: inputs.publish_release
        env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          VERSION_NAME: ${{ env.RYLUX_VERSION_NAME }}
          VERSION_CODE: ${{ env.RYLUX_VERSION_CODE }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          GITEE_DIR="$RUNNER_TEMP/rlyux-gitee"
          ASKPASS="$RUNNER_TEMP/gitee-askpass.sh"
          cat > "$ASKPASS" <<'ASKPASS_EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *Password*) printf '%s\n' "$GITEE_RELEASE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "$ASKPASS"
          git clone --depth 1 --single-branch --branch master https://gitee.com/perish-with-honor/rlyux.git "$GITEE_DIR"
          rsync -a --delete app/ "$GITEE_DIR/app/"
          for path in .gitignore build.gradle gradle.properties settings.gradle; do
            if [[ -d "$path" ]]; then
              rsync -a --delete "$path/" "$GITEE_DIR/$path/"
            elif [[ -f "$path" ]]; then
              cp -a "$path" "$GITEE_DIR/$path"
            fi
          done
          git -C "$GITEE_DIR" add -A -- .gitignore app build.gradle gradle.properties settings.gradle
          if ! git -C "$GITEE_DIR" diff --cached --quiet; then
            git -C "$GITEE_DIR" config user.name "GitHub Actions"
            git -C "$GITEE_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$GITEE_DIR" commit -m "Sync RYLUX Android source for v${VERSION_NAME}"
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git -C "$GITEE_DIR" push origin HEAD:master
          fi
          API="https://gitee.com/api/v5/repos/perish-with-honor/rlyux"
          TAG="v${VERSION_NAME}"
          APK="RYLUX-${TAG}.apk"
          test -f "$APK"
          SHA256="$(sha256sum "$APK" | cut -d " " -f 1)"
          BODY="$(printf 'Built and signed by the GitHub Actions RYLUX release workflow.\nVersion code: %s\nGitHub source commit: %s\nSHA-256: %s' "$VERSION_CODE" "$SOURCE_COMMIT" "$SHA256")"
          RELEASE_JSON="$RUNNER_TEMP/gitee-release.json"
          STATUS="$(curl --silent --show-error --output "$RELEASE_JSON" --write-out "%{http_code}" "$API/releases/tags/$TAG")"
          if [[ "$STATUS" == "404" ]] || { [[ "$STATUS" == "200" ]] && jq -e 'type == "null"' "$RELEASE_JSON" >/dev/null; }; then
            STATUS="$(curl --silent --show-error --output "$RELEASE_JSON" --write-out "%{http_code}" \
              --request POST "$API/releases" \
              --data-urlencode "access_token=$GITEE_RELEASE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=RYLUX $VERSION_NAME" \
              --data-urlencode "body=$BODY" \
              --data-urlencode "target_commitish=master" \
              --data-urlencode "prerelease=false")"
            [[ "$STATUS" == "201" ]] || { echo "Gitee release creation failed (HTTP $STATUS)"; exit 1; }
          elif [[ "$STATUS" == "200" ]] && jq -e 'type == "object" and (.id != null)' "$RELEASE_JSON" >/dev/null; then
            RELEASE_ID="$(jq -er '.id' "$RELEASE_JSON")"
            STATUS="$(curl --silent --show-error --output "$RELEASE_JSON" --write-out "%{http_code}" \
              --request PATCH "$API/releases/$RELEASE_ID" \
              --data-urlencode "access_token=$GITEE_RELEASE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=RYLUX $VERSION_NAME" \
              --data-urlencode "body=$BODY")"
            [[ "$STATUS" == "200" ]] || { echo "Gitee release update failed (HTTP $STATUS)"; exit 1; }
          else
            echo "Gitee release lookup failed (HTTP $STATUS)"
            exit 1
          fi
          RELEASE_ID="$(jq -er '.id' "$RELEASE_JSON")"
          ASSETS_JSON="$RUNNER_TEMP/gitee-assets.json"
          STATUS="$(curl --silent --show-error --output "$ASSETS_JSON" --write-out "%{http_code}" "$API/releases/$RELEASE_ID/attach_files?per_page=100")"
          [[ "$STATUS" == "200" ]] || { echo "Gitee asset lookup failed (HTTP $STATUS)"; exit 1; }
          AUTH_CONFIG="$RUNNER_TEMP/gitee-auth-curl.conf"
          trap 'rm -f "$AUTH_CONFIG"' EXIT
          while IFS= read -r ASSET_ID; do
            [[ -n "$ASSET_ID" ]] || continue
            (umask 077; printf 'url = "%s?access_token=%s"\n' "$API/releases/$RELEASE_ID/attach_files/$ASSET_ID" "$GITEE_RELEASE_TOKEN" > "$AUTH_CONFIG")
            STATUS="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --request DELETE --config "$AUTH_CONFIG")"
            [[ "$STATUS" == "204" ]] || { echo "Gitee old APK replacement failed (HTTP $STATUS)"; exit 1; }
          done < <(jq -r --arg name "$APK" '.[] | select(.name == $name) | .id' "$ASSETS_JSON")
          ASSET_JSON="$RUNNER_TEMP/gitee-asset.json"
          STATUS="$(curl --silent --show-error --output "$ASSET_JSON" --write-out "%{http_code}" \
            --request POST "$API/releases/$RELEASE_ID/attach_files" \
            --form-string "access_token=$GITEE_RELEASE_TOKEN" \
            --form "file=@$APK")"
          [[ "$STATUS" == "201" ]] || { echo "Gitee APK upload failed (HTTP $STATUS)"; exit 1; }
          [[ "$(jq -er '.name' "$ASSET_JSON")" == "$APK" ]]
          [[ "$(jq -er '.size' "$ASSET_JSON")" == "$(stat -c "%s" "$APK")" ]]
          echo "Synced $APK to Gitee release $TAG; SHA-256=$SHA256"
