name: Build and Release RYLUX APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (example: v2.0.0)'
        required: true
        default: 'v2.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-24.04

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk "RYLUX-${RELEASE_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RYLUX ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            RYLUX-${{ env.RELEASE_TAG }}.apk
