name: Deploy RYLUX Relay Worker

on:
  push:
    branches:
      - feature/rylux-game-relay
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rylux-relay-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy Worker and sync relay secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 258e12e0f01539eb1f83919b3f97b5c8
          wranglerVersion: "4"
          workingDirectory: cf-worker
          command: deploy worker.js --name rylux-cdn --compatibility-date=2026-09-23
          preCommands: npx wrangler whoami
          postCommands: |
            printf '%s' "$RYLUX_RELAY_TOKEN" | npx wrangler secret put RYLUX_RELAY_TOKEN --name rylux-cdn
        env:
          RYLUX_RELAY_TOKEN: ${{ secrets.RYLUX_RELAY_TOKEN }}

      - name: Verify relay routes and upstream TCP handshake
        shell: bash
        env:
          RELAY_TOKEN: ${{ secrets.RYLUX_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          # Allow the newly uploaded Worker secret to propagate to edge locations.
          sleep 10
          unknown_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://relay.lovenom.eu.org/rylux-game/not-a-real-target)"
          if [[ "$unknown_status" != "404" ]]; then
            echo "Expected unknown relay target to return 404, got $unknown_status"
            exit 1
          fi
          for path in target-2 target-3; do
            unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://relay.lovenom.eu.org/rylux-game/$path")"
            if [[ "$unauthorized_status" != "401" ]]; then
              echo "Expected protected relay target $path to return 401 without credentials, got $unauthorized_status"
              exit 1
            fi
          done

          python3 - <<'PY'
          import os
          import socket
          import ssl

          host = "relay.lovenom.eu.org"
          for path in ("/rylux-game/target-2", "/rylux-game/target-3"):
              request = (
                  f"GET {path} HTTP/1.1\r\n"
                  f"Host: {host}\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
                  f"Authorization: Bearer {os.environ['RELAY_TOKEN']}\r\n\r\n"
              ).encode("ascii")
              context = ssl.create_default_context()
              with socket.create_connection((host, 443), timeout=10) as raw:
                  with context.wrap_socket(raw, server_hostname=host) as connection:
                      connection.settimeout(12)
                      connection.sendall(request)
                      response = bytearray()
                      while b"\r\n\r\n" not in response and len(response) < 65536:
                          chunk = connection.recv(4096)
                          if not chunk:
                              break
                          response.extend(chunk)
              status_line = bytes(response).split(b"\r\n", 1)[0].decode("ascii", "replace")
              if not status_line.startswith("HTTP/1.1 101 "):
                  print(f"Expected WebSocket 101 for {path}, got {status_line or 'no response'}")
                  raise SystemExit(1)
              print(f"Approved relay route {path} accepted WebSocket handshake (101).")
          PY
