name: Validate RYLUX

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Python sources
        run: |
          python3 -m py_compile backend/*.py tools/rylux-patch-encryptor.py tools/build-rylux-mirror.py

      - name: Test backend agent and referral flows
        run: |
          python3 -m pip install -r backend/requirements.txt httpx pytest
          python3 -m pytest backend/test_agent_referral.py -q
          node --check backend/admin_web/app.js
          node --check backend/agent_web/app.js

      - name: Build Android debug APK
        run: |
          gradle assembleDebug --stacktrace
