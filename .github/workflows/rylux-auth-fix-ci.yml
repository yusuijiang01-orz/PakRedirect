name: RYLUX auth UX and IP guard test

on:
  push:
    branches:
      - fix/rylux-auth-ui-ip-guard

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt httpx

      - name: Backend syntax and registration guard smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app.py backend/registration_guard_v1.py backend/user_v1.py backend/admin_v2.py backend/admin_key_access.py backend/admin_code_v1.py
          cd backend
          export PAKREDIRECT_LICENSE_DB="$RUNNER_TEMP/rylux-auth-fix.db"
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app

          app.init_db()
          client = TestClient(app.app, base_url='https://testserver')

          first = client.post('/api/v1/auth/register', headers={'X-Real-IP':'203.0.113.10'}, json={
              'username':'firstuser','password':'password123','device_id':'dev-a'
          })
          assert first.status_code == 200, first.text
          assert first.json()['user']['membership']['kind'] == 'trial'

          second = client.post('/api/v1/auth/register', headers={'X-Real-IP':'203.0.113.10'}, json={
              'username':'seconduser','password':'password123','device_id':'dev-b'
          })
          assert second.status_code == 429, second.text
          assert '48 小时' in second.json()['detail']

          other = client.post('/api/v1/auth/register', headers={'X-Real-IP':'203.0.113.11'}, json={
              'username':'otheruser','password':'password123','device_id':'dev-c'
          })
          assert other.status_code == 200, other.text

          with app.open_db() as db:
              module = db.execute("SELECT name FROM modules WHERE code='sg_localization'").fetchone()
              assert module['name'] == '封神榜汉化'
              rows = db.execute("SELECT registration_ip_hash FROM app_users ORDER BY id").fetchall()
              assert all(r['registration_ip_hash'] for r in rows)

          print('registration guard smoke passed')
          PY

      - name: Source assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q '确认密码' app/src/main/java/com/example/pakredirect/MainActivity.java
          grep -q '记住密码' app/src/main/java/com/example/pakredirect/MainActivity.java
          grep -q 'ic_menu_view' app/src/main/java/com/example/pakredirect/MainActivity.java
          grep -q '封神榜汉化' app/src/main/java/com/example/pakredirect/MainActivity.java
          ! grep -q '游戏工具与模块启动平台' app/src/main/java/com/example/pakredirect/MainActivity.java
          ! grep -q 'V1 · 账号' app/src/main/java/com/example/pakredirect/MainActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build RYLUX debug APK
        run: gradle assembleDebug --stacktrace
