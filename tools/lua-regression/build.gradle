plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

def repositoryRoot = file('../..').canonicalFile

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

sourceSets {
    test {
        java {
            setSrcDirs([
                new File(repositoryRoot, 'app/src/main/java'),
                new File(repositoryRoot, 'app/src/test/java')
            ])
            include '**/LuaSourceCompat.java'
            include '**/LegacyLuaCompat.java'
            include '**/LegacyLuaConfig.java'
            include '**/LegacyCoordinateMapper.java'
            include '**/LegacyImageMatcher.java'
            include '**/LegacyTuringCompat.java'
            include '**/LegacyTuringCompatTest.java'
            include '**/LuaInstructionGate.java'
            include '**/ScriptExecutionControl.java'
            include '**/ScriptAdapterConnectionGate.java'
            include '**/ScriptForegroundGate.java'
            include '**/ScriptForegroundTarget.java'
            include '**/ScriptScreenshotRetry.java'
            include '**/TargetGameNotForegroundException.java'
            include '**/CnDownloadRouter.java'
            include '**/ScriptStartupTerms.java'
            include '**/ScriptHudStatus.java'
            include '**/ScriptRuntimeErrors.java'
            include '**/RecoveredLuaTaskTest.java'
            include '**/RecoveredLuaLiveLoginTest.java'
            include '**/LiveLuaDeviceHost.java'
            include '**/LegacyLuaConfigTest.java'
            include '**/LegacyLuaCompatTest.java'
            include '**/LuaSourceCompatTest.java'
            include '**/RecoveredLuaStartupTest.java'
            include '**/LuaInstructionGateTest.java'
            include '**/ScriptExecutionControlTest.java'
            include '**/ScriptAdapterConnectionGateTest.java'
            include '**/ScriptForegroundGateTest.java'
            include '**/ScriptForegroundTargetTest.java'
            include '**/ScriptScreenshotRetryTest.java'
            include '**/CnDownloadRouterTest.java'
            include '**/ScriptStartupTermsTest.java'
            include '**/ScriptHudStatusTest.java'
            include '**/ScriptRuntimeErrorsTest.java'
        }
        resources {
            setSrcDirs([new File(repositoryRoot, 'app/src/test/resources')])
        }
    }
}

dependencies {
    testImplementation 'org.luaj:luaj-jse:3.0.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    workingDir repositoryRoot
    systemProperty 'user.dir', repositoryRoot.absolutePath
    // These tests load real Lua from disk, outside the Java source/resource sets.
    // Changing a script must invalidate Gradle's cached result for a selected task.
    inputs.files(fileTree(new File(repositoryRoot, 'app/src/main/assets/script_modules')))
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('stage1Test', Test) {
    description = 'Runs only recovered Lua loading, lifecycle control, and compatibility regressions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaStartupTest'
        includeTestsMatching 'com.example.pakredirect.LuaInstructionGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptExecutionControlTest'
        includeTestsMatching 'com.example.pakredirect.LegacyLuaConfigTest'
        includeTestsMatching 'com.example.pakredirect.LegacyLuaCompatTest'
        includeTestsMatching 'com.example.pakredirect.LegacyTuringCompatTest'
        includeTestsMatching 'com.example.pakredirect.LuaSourceCompatTest'
    }
}

tasks.register('stage2Test', Test) {
    description = 'Runs only Lua host connection, foreground, screenshot retry, HUD, and diagnostic regressions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.example.pakredirect.ScriptAdapterConnectionGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptForegroundGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptForegroundTargetTest'
        includeTestsMatching 'com.example.pakredirect.ScriptScreenshotRetryTest'
        includeTestsMatching 'com.example.pakredirect.ScriptHudStatusTest'
        includeTestsMatching 'com.example.pakredirect.ScriptRuntimeErrorsTest'
    }
}

tasks.register('stage3Test', Test) {
    description = 'Runs only localized startup terms and recovered Lua login regressions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.example.pakredirect.ScriptStartupTermsTest'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedServerClusterRequiresChineseTitleAndConfirmBeforeTap'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedLoginRequiresKnownChinesePageAndSavedAccount'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedCharacterSelectConfirmsOcrPositionWhenLegacyTemplateMisses'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedCharacterSelectRejectsUnrelatedConfirmAndIncompleteAnchors'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedLoginTimeoutClosesBusyDialogAndWaitsBeforeRetry'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.localizedLoginMatchesObservedRapidOcrRowsFromCurrentLoginScreenshot'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.repeatedStalledLoginDialogRetriesStayBoundedWithoutDuplicateTaps'
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaTaskTest.stalledLoginWithoutReadableReturnNeverUsesGuessedCoordinate'
    }
}

// Device-backed login is explicitly selected after the stage-3 fixture gate.
// Missing device/OCR configuration fails this task instead of silently skipping.
tasks.register('stage3LiveTest', Test) {
    description = 'Runs only the recovered Lua login on the connected sandbox game; saves live evidence.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    inputs.file(new File(repositoryRoot, 'tools/lua-regression/live_ocr_worker.py'))
    for (String key : ['RYLUX_ADB_EXECUTABLE', 'RYLUX_ADB_DEVICE', 'RYLUX_OCR_PYTHON', 'RYLUX_LIVE_EVIDENCE_DIR']) {
        inputs.property(key, providers.environmentVariable(key).orElse('unset'))
    }
    filter {
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaLiveLoginTest'
    }
}

tasks.named('test', Test) {
    exclude '**/RecoveredLuaLiveLoginTest.class'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
