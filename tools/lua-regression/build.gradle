plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

def repositoryRoot = file('../..').canonicalFile

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

sourceSets {
    test {
        java {
            setSrcDirs([
                new File(repositoryRoot, 'app/src/main/java'),
                new File(repositoryRoot, 'app/src/test/java')
            ])
            include '**/LuaSourceCompat.java'
            include '**/LegacyLuaCompat.java'
            include '**/LegacyLuaConfig.java'
            include '**/LegacyCoordinateMapper.java'
            include '**/LegacyImageMatcher.java'
            include '**/LegacyTuringCompat.java'
            include '**/LegacyTuringCompatTest.java'
            include '**/LuaInstructionGate.java'
            include '**/ScriptExecutionControl.java'
            include '**/ScriptAdapterConnectionGate.java'
            include '**/ScriptForegroundGate.java'
            include '**/ScriptForegroundTarget.java'
            include '**/ScriptScreenshotRetry.java'
            include '**/TargetGameNotForegroundException.java'
            include '**/CnDownloadRouter.java'
            include '**/ScriptStartupTerms.java'
            include '**/ScriptHudStatus.java'
            include '**/RecoveredLuaTaskTest.java'
            include '**/LegacyLuaConfigTest.java'
            include '**/LegacyLuaCompatTest.java'
            include '**/RecoveredLuaStartupTest.java'
            include '**/LuaInstructionGateTest.java'
            include '**/ScriptExecutionControlTest.java'
            include '**/ScriptAdapterConnectionGateTest.java'
            include '**/ScriptForegroundGateTest.java'
            include '**/ScriptForegroundTargetTest.java'
            include '**/ScriptScreenshotRetryTest.java'
            include '**/CnDownloadRouterTest.java'
            include '**/ScriptStartupTermsTest.java'
            include '**/ScriptHudStatusTest.java'
        }
        resources {
            setSrcDirs([new File(repositoryRoot, 'app/src/test/resources')])
        }
    }
}

dependencies {
    testImplementation 'org.luaj:luaj-jse:3.0.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    workingDir repositoryRoot
    systemProperty 'user.dir', repositoryRoot.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
