plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

def repositoryRoot = file('../..').canonicalFile

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

sourceSets {
    test {
        java {
            setSrcDirs([
                new File(repositoryRoot, 'app/src/main/java'),
                new File(repositoryRoot, 'app/src/test/java')
            ])
            include '**/LuaSourceCompat.java'
            include '**/LegacyLuaCompat.java'
            include '**/LegacyLuaConfig.java'
            include '**/LegacyCoordinateMapper.java'
            include '**/LegacyImageMatcher.java'
            include '**/LegacyTuringCompat.java'
            include '**/LegacyTuringCompatTest.java'
            include '**/LuaInstructionGate.java'
            include '**/ScriptExecutionControl.java'
            include '**/ScriptAdapterConnectionGate.java'
            include '**/ScriptForegroundGate.java'
            include '**/ScriptForegroundTarget.java'
            include '**/ScriptScreenshotRetry.java'
            include '**/TargetGameNotForegroundException.java'
            include '**/CnDownloadRouter.java'
            include '**/ScriptStartupTerms.java'
            include '**/ScriptHudStatus.java'
            include '**/ScriptRuntimeErrors.java'
            include '**/RecoveredLuaTaskTest.java'
            include '**/LegacyLuaConfigTest.java'
            include '**/LegacyLuaCompatTest.java'
            include '**/LuaSourceCompatTest.java'
            include '**/RecoveredLuaStartupTest.java'
            include '**/LuaInstructionGateTest.java'
            include '**/ScriptExecutionControlTest.java'
            include '**/ScriptAdapterConnectionGateTest.java'
            include '**/ScriptForegroundGateTest.java'
            include '**/ScriptForegroundTargetTest.java'
            include '**/ScriptScreenshotRetryTest.java'
            include '**/CnDownloadRouterTest.java'
            include '**/ScriptStartupTermsTest.java'
            include '**/ScriptHudStatusTest.java'
            include '**/ScriptRuntimeErrorsTest.java'
        }
        resources {
            setSrcDirs([new File(repositoryRoot, 'app/src/test/resources')])
        }
    }
}

dependencies {
    testImplementation 'org.luaj:luaj-jse:3.0.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    workingDir repositoryRoot
    systemProperty 'user.dir', repositoryRoot.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('stage1Test', Test) {
    description = 'Runs only recovered Lua loading, lifecycle control, and compatibility regressions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.example.pakredirect.RecoveredLuaStartupTest'
        includeTestsMatching 'com.example.pakredirect.LuaInstructionGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptExecutionControlTest'
        includeTestsMatching 'com.example.pakredirect.LegacyLuaConfigTest'
        includeTestsMatching 'com.example.pakredirect.LegacyLuaCompatTest'
        includeTestsMatching 'com.example.pakredirect.LegacyTuringCompatTest'
        includeTestsMatching 'com.example.pakredirect.LuaSourceCompatTest'
    }
}

tasks.register('stage2Test', Test) {
    description = 'Runs only Lua host connection, foreground, screenshot retry, HUD, and diagnostic regressions.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.example.pakredirect.ScriptAdapterConnectionGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptForegroundGateTest'
        includeTestsMatching 'com.example.pakredirect.ScriptForegroundTargetTest'
        includeTestsMatching 'com.example.pakredirect.ScriptScreenshotRetryTest'
        includeTestsMatching 'com.example.pakredirect.ScriptHudStatusTest'
        includeTestsMatching 'com.example.pakredirect.ScriptRuntimeErrorsTest'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
