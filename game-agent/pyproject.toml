[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rylux-game-agent"
version = "0.1.0"
description = "A local, supervised learning harness for games running in the RYLUX BlackBox sandbox."
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
rylux-agent = "game_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
