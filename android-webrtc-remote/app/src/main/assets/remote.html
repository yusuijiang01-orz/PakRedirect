<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Android 远控</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#fff;height:100%;overflow:hidden;font-family:system-ui}video{width:100%;height:100%;object-fit:contain;touch-action:none}#login{position:fixed;inset:0;display:grid;place-content:center;gap:12px;background:#0b0d10;z-index:3}input,button{font:inherit;padding:13px;border-radius:12px;border:0}#orb{position:fixed;right:18px;bottom:30px;width:52px;height:52px;border-radius:50%;background:#22c55eaa;color:#fff;z-index:2}#menu{position:fixed;right:18px;bottom:92px;display:none;grid-template-columns:repeat(2,64px);gap:8px;z-index:2}#menu button{background:#20242bcc;color:#fff;padding:10px 4px;font-size:13px}</style></head><body><div id="login"><b>局域网远控</b><input id="pin" inputmode="numeric" placeholder="输入模拟器上的 PIN"><button id="go">连接</button><span id="status">请确保两端 Tailscale 已连接</span></div><video id="v" autoplay playsinline muted></video><button id="orb">●</button><div id="menu"><button data-c="back">返回</button><button data-c="home">主页</button><button data-c="recent">最近</button><button data-c="notifications">通知</button><button id="full">全屏</button><button id="retry">重连</button></div><script>
let pc,dc,start,pin;const v=document.querySelector('#v'),status=document.querySelector('#status');async function connect(){pin=document.querySelector('#pin').value;status.textContent='正在建立 WebRTC…';pc=new RTCPeerConnection({iceServers:[]});dc=pc.createDataChannel('control',{ordered:false,maxRetransmits:0});pc.ontrack=e=>{v.srcObject=e.streams[0]||new MediaStream([e.track]);document.querySelector('#login').style.display='none'};pc.addTransceiver('video',{direction:'recvonly'});let o=await pc.createOffer();await pc.setLocalDescription(o);await new Promise(r=>pc.iceGatheringState==='complete'?r():pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&r()));let res=await fetch('/offer?pin='+encodeURIComponent(pin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(pc.localDescription)});if(!res.ok)throw Error(await res.text());await pc.setRemoteDescription(await res.json());status.textContent='等待画面…'}document.querySelector('#go').onclick=()=>connect().catch(e=>status.textContent='连接失败：'+e.message);function send(x){if(dc?.readyState==='open')dc.send(x)};let down=false;function pos(e){let r=v.getBoundingClientRect(),t=e.touches?.[0]||e.changedTouches?.[0]||e;return[(t.clientX-r.left)/r.width,(t.clientY-r.top)/r.height]}v.addEventListener('pointerdown',e=>{down=true;start=pos(e)});v.addEventListener('pointerup',e=>{if(!down)return;down=false;let q=pos(e),d=Math.hypot(q[0]-start[0],q[1]-start[1]);send(d<.02?'tap|'+q.join('|'):'swipe|'+start.join('|')+'|'+q.join('|'))});document.querySelector('#orb').onclick=()=>{let m=document.querySelector('#menu');m.style.display=m.style.display==='grid'?'none':'grid'};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.querySelector('#retry').onclick=()=>{pc?.close();document.querySelector('#login').style.display='grid'};
</script></body></html>
