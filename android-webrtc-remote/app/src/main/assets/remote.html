<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Android 远控</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#fff;height:100%;overflow:hidden;font-family:system-ui}video{width:100%;height:100%;object-fit:contain;touch-action:none}#login{position:fixed;inset:0;display:grid;place-content:center;gap:12px;background:#0b0d10dd;z-index:3;padding:28px}input,button{font:inherit;padding:13px;border-radius:12px;border:0}#status{white-space:pre-line;max-width:340px;line-height:1.5;color:#d1d5db}#orb{position:fixed;right:18px;bottom:30px;width:52px;height:52px;border-radius:50%;background:#22c55eaa;color:#fff;z-index:2}#menu{position:fixed;right:18px;bottom:92px;display:none;grid-template-columns:repeat(2,64px);gap:8px;z-index:2}#menu button{background:#20242bcc;color:#fff;padding:10px 4px;font-size:13px}</style></head><body><div id="login"><b>局域网远控 alpha3</b><input id="pin" inputmode="numeric" placeholder="输入模拟器上的 PIN"><button id="go">连接</button><span id="status">请确保两端 Tailscale 已连接</span></div><video id="v" autoplay playsinline muted></video><button id="orb">●</button><div id="menu"><button data-c="back">返回</button><button data-c="home">主页</button><button data-c="recent">最近</button><button data-c="notifications">通知</button><button id="full">全屏</button><button id="retry">重连</button></div><script>
let pc,dc,start,pin,timer;const v=document.querySelector('#v'),status=document.querySelector('#status'),login=document.querySelector('#login');function show(x){status.textContent=x}async function connect(){clearTimeout(timer);pin=document.querySelector('#pin').value;show('正在建立 WebRTC…');pc?.close();pc=new RTCPeerConnection({iceServers:[]});dc=pc.createDataChannel('control',{ordered:false,maxRetransmits:0});pc.oniceconnectionstatechange=()=>show('ICE: '+pc.iceConnectionState+'\n连接: '+pc.connectionState+'\n视频: '+(v.videoWidth?v.videoWidth+'×'+v.videoHeight:'尚未收到首帧'));pc.onconnectionstatechange=pc.oniceconnectionstatechange;pc.ontrack=e=>{show('已收到视频轨道，等待首帧…');v.srcObject=e.streams[0]||new MediaStream([e.track]);v.play().catch(err=>show('Safari 播放失败: '+err.message));timer=setTimeout(()=>{if(!v.videoWidth)show('ICE: '+pc.iceConnectionState+'\n连接: '+pc.connectionState+'\n已收到轨道，但 8 秒内没有视频帧')},8000)};v.onplaying=()=>{clearTimeout(timer);login.style.display='none'};let tr=pc.addTransceiver('video',{direction:'recvonly'});if(tr.setCodecPreferences&&RTCRtpReceiver.getCapabilities){let codecs=RTCRtpReceiver.getCapabilities('video').codecs,h=codecs.filter(c=>c.mimeType.toLowerCase()==='video/h264'),o=codecs.filter(c=>c.mimeType.toLowerCase()!=='video/h264');if(h.length)tr.setCodecPreferences([...h,...o])}let o=await pc.createOffer();await pc.setLocalDescription(o);await new Promise(r=>pc.iceGatheringState==='complete'?r():pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&r()));let res=await fetch('/offer?pin='+encodeURIComponent(pin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(pc.localDescription)});if(!res.ok)throw Error(await res.text());await pc.setRemoteDescription(await res.json());show('Answer 已设置，正在检查 Tailscale 直连…')}document.querySelector('#go').onclick=()=>connect().catch(e=>show('连接失败：'+e.message));function send(x){if(dc?.readyState==='open')dc.send(x)};let down=false;function pos(e){let r=v.getBoundingClientRect(),t=e.touches?.[0]||e.changedTouches?.[0]||e;return[(t.clientX-r.left)/r.width,(t.clientY-r.top)/r.height]}v.addEventListener('pointerdown',e=>{down=true;start=pos(e)});v.addEventListener('pointerup',e=>{if(!down)return;down=false;let q=pos(e),d=Math.hypot(q[0]-start[0],q[1]-start[1]);send(d<.02?'tap|'+q.join('|'):'swipe|'+start.join('|')+'|'+q.join('|'))});document.querySelector('#orb').onclick=()=>{let m=document.querySelector('#menu');m.style.display=m.style.display==='grid'?'none':'grid'};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.querySelector('#retry').onclick=()=>{pc?.close();login.style.display='grid';show('已断开，请重新连接')};
</script></body></html>
