pluginManagement {
    repositories {
        maven { url 'https://www.jitpack.io' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://www.jitpack.io' }
        google()
        mavenCentral()
    }
}
rootProject.name = 'PakRedirect'
include ':app', ':black-reflection', ':compiler', ':Bcore'

project(':black-reflection').projectDir = file('vendor/BlackBoxReborn/black-reflection')
project(':compiler').projectDir = file('vendor/BlackBoxReborn/compiler')
project(':Bcore').projectDir = file('vendor/BlackBoxReborn/Bcore')
