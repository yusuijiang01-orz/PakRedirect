plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pakredirect'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.pakredirect'
        minSdk 26
        targetSdk 35
        ndk {
            // BlackBox's JNI core ships ARM binaries only. Avoid a transitive
            // x86 tunnel library making x86 emulators select an unusable ABI.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        versionCode = (project.findProperty('ryluxVersionCode') ?: '152').toInteger()
        versionName = (project.findProperty('ryluxVersionName') ?: '2.5.28-cora-json-3.43').toString()
        manifestPlaceholders = [ryluxWechatAppId: (project.findProperty('ryluxWechatAppId') ?: 'wx_replace_with_merchant_appid').toString()]
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-26'
            }
        }
    }

    sourceSets {
        main {
            // Protected localization PAKs are never embedded in the APK.
            // Only the non-secret linkspak fallback is packaged here.
            assets.srcDirs = ['src/main/assets']
        }
        test {
            // Pixel-fixture Lua integration tests use java.awt/ImageIO and run
            // in tools/lua-regression, not Android's local unit-test runtime.
            java.exclude '**/RecoveredLuaTaskTest.java'
            java.exclude '**/RecoveredLuaLiveLoginTest.java'
            java.exclude '**/RecoveredLuaLiveBackpackDetectionTest.java'
            java.exclude '**/SandboxBagSnapshotPolicyTest.java'
            java.exclude '**/RecoveredLuaLiveActivityPanelTest.java'
            java.exclude '**/RecoveredLuaLiveCombatTest.java'
            java.exclude '**/RecoveredLuaLiveMedicineTest.java'
            java.exclude '**/RecoveredLuaLiveMerchantTest.java'
            java.exclude '**/RecoveredLuaLivePartyCreationTest.java'
            java.exclude '**/RecoveredLuaLivePartyPanelTest.java'
            java.exclude '**/RecoveredLuaLiveRouteTest.java'
            java.exclude '**/LiveLuaDeviceHost.java'
            java.exclude '**/AdbLoginPngDecodeTest.java'
            java.exclude '**/AdbSemanticLoginTest.java'
            java.exclude '**/AdbVisionAdapterTest.java'
            java.exclude '**/LuaWebRouteFlowTest.java'
            java.exclude '**/ScriptMapCatalogParityTest.java'
            java.exclude '**/ScriptRuntimeLogTest.java'
            java.exclude '**/ScriptWebProfileQueueTest.java'
            java.exclude '**/ScriptWebRouteQueueTest.java'
            java.exclude '**/SemanticLoginFlowTest.java'
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv('RYLUX_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('RYLUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RYLUX_KEY_ALIAS')
                keyPassword System.getenv('RYLUX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (project.findProperty('blackboxHookDiagnostics') == 'true') {
                // Keep the throwaway hook-isolation build separate from the
                // user's installed, release-signed RYLUX test APK.
                applicationIdSuffix '.hookdiag'
                versionNameSuffix '-hookdiag'
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }
    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':Bcore')
    implementation 'org.luaj:luaj-jse:3.0.1'
    // Bundled OCR models work without a Play Services model download at first use.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.alipay.sdk:alipay-sdk-android:15.8.09@aar'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.40'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('com.zaneschepke:hevtunnel:1.0.0') {
        // TProxyService is a JNI-only entry point; exclude unrelated UI AndroidX metadata.
        exclude group: 'androidx.core'
        exclude group: 'androidx.appcompat'
        exclude group: 'com.google.android.material'
    }

    testImplementation 'junit:junit:4.13.2'
    // Android's local-test android.jar stubs throw for org.json calls. Use the
    // platform-compatible JSON implementation when exercising workflow graphs.
    testImplementation 'org.json:json:20240303'
}
