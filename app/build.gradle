plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pakredirect'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.pakredirect'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('ryluxVersionCode') ?: '12').toInteger()
        versionName = (project.findProperty('ryluxVersionName') ?: '2.3.0').toString()
    }

    sourceSets {
        main {
            // Protected localization PAKs are never embedded in the APK.
            // Only the non-secret linkspak fallback is packaged here.
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv('RYLUX_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('RYLUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RYLUX_KEY_ALIAS')
                keyPassword System.getenv('RYLUX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
