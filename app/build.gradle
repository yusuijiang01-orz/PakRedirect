plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pakredirect'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.pakredirect'
        minSdk 26
        targetSdk 35
        ndk {
            // BlackBox's JNI core ships ARM binaries only. Avoid a transitive
            // x86 tunnel library making x86 emulators select an unusable ABI.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        versionCode = (project.findProperty('ryluxVersionCode') ?: '37').toInteger()
        versionName = (project.findProperty('ryluxVersionName') ?: '2.4.16').toString()
        manifestPlaceholders = [ryluxWechatAppId: (project.findProperty('ryluxWechatAppId') ?: 'wx_replace_with_merchant_appid').toString()]
    }

    sourceSets {
        main {
            // Protected localization PAKs are never embedded in the APK.
            // Only the non-secret linkspak fallback is packaged here.
            assets.srcDirs = ['src/main/assets']
        }
        test {
            // Pixel-fixture Lua integration tests use java.awt/ImageIO and run
            // in tools/lua-regression, not Android's local unit-test runtime.
            java.exclude '**/RecoveredLuaTaskTest.java'
            java.exclude '**/RecoveredLuaLiveLoginTest.java'
            java.exclude '**/LiveLuaDeviceHost.java'
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv('RYLUX_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('RYLUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RYLUX_KEY_ALIAS')
                keyPassword System.getenv('RYLUX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':Bcore')
    implementation 'org.luaj:luaj-jse:3.0.1'
    // Bundled OCR models work without a Play Services model download at first use.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.alipay.sdk:alipay-sdk-android:15.8.09@aar'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.40'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('com.zaneschepke:hevtunnel:1.0.0') {
        // TProxyService is a JNI-only entry point; exclude unrelated UI AndroidX metadata.
        exclude group: 'androidx.core'
        exclude group: 'androidx.appcompat'
        exclude group: 'com.google.android.material'
    }

    testImplementation 'junit:junit:4.13.2'
}
