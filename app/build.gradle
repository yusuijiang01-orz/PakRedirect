plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pakredirect'
    compileSdk 35

    defaultConfig {
        // Keep the existing package id for upgrade compatibility in V1.
        applicationId 'com.example.pakredirect'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.0.1'
    }

    sourceSets {
        main {
            // Bundle linkspak.txt and the localization PAK payload directly into the APK.
            assets.srcDirs = ['../pak']
        }
    }

    // Keep PAK assets stored without ZIP compression so their exact lengths are
    // available through AssetFileDescriptor and Range responses can be served efficiently.
    androidResources {
        noCompress += ['pak']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
